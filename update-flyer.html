<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>MMFM Workshop — CVPR 2026 Update</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #d9d4ce;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.4;
    color: #1a1816;
  }

  h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; font-weight: 700; }

  .card {
    width: 1080px;
    height: 1080px;
    background: #faf9f7;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ─── HERO ─── */
  .hero {
    position: relative;
    padding: 44px 56px 40px;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background: url('public/assets/MMFMAudience.jpg') center 38% / cover no-repeat;
    filter: brightness(0.45);
    z-index: 0;
  }

  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(26,24,22,0.82) 0%, rgba(26,24,22,0.62) 100%);
    z-index: 1;
  }

  .hero-content { position: relative; z-index: 2; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: white;
    border-radius: 7px;
    font-size: 18px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 18px;
  }

  .badge img { height: 34px; width: auto; }

  .edition {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #f0a030;
    margin-left: 8px;
  }

  .update-tag {
    display: inline-block;
    font-family: 'Outfit', sans-serif;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #1a1816;
    background: #f0a030;
    padding: 8px 20px;
    border-radius: 999px;
    margin-bottom: 20px;
  }

  .hero h1 {
    font-size: 60px;
    font-weight: 800;
    color: #fff;
    line-height: 1.02;
    letter-spacing: -1.5px;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
  }

  .hero .subtitle {
    margin-top: 14px;
    font-size: 24px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.82);
  }

  /* ─── UPDATES ─── */
  .updates {
    flex: 1;
    padding: 40px 56px 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .upd-item {
    display: flex;
    align-items: center;
    gap: 26px;
    padding: 28px 32px;
    background: #fffffe;
    border: 1px solid #ece8e3;
    border-radius: 16px;
    box-shadow: 0 2px 10px rgba(26,24,22,0.04);
  }

  .upd-item.accent {
    background: rgba(180, 83, 9, 0.06);
    border-color: rgba(180, 83, 9, 0.18);
  }

  .upd-icon {
    flex: 0 0 auto;
    width: 78px;
    height: 78px;
    border-radius: 18px;
    background: #2d2926;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .upd-item.accent .upd-icon { background: #b45309; }

  .upd-icon svg { stroke: #f0a030; }
  .upd-item.accent .upd-icon svg { stroke: #fff; }

  .upd-label {
    font-size: 18px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8a837c;
    margin-bottom: 4px;
  }

  .upd-value {
    font-family: 'Outfit', sans-serif;
    font-size: 40px;
    font-weight: 800;
    color: #1a1816;
    line-height: 1.08;
    letter-spacing: -0.8px;
  }

  .upd-value .sub {
    font-family: 'DM Sans', sans-serif;
    font-size: 24px;
    font-weight: 600;
    color: #b45309;
    margin-left: 12px;
    letter-spacing: 0;
  }

  /* ─── FOOTER ─── */
  .footer {
    padding: 24px 56px;
    background: #1a1816;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-logo {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
  }

  .footer-logo span {
    font-family: 'DM Sans', sans-serif;
    font-size: 17px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.5);
    margin-left: 12px;
  }

  .footer-url {
    font-size: 24px;
    font-weight: 700;
    color: #f0a030;
  }
</style>
</head>
<body>

<div class="card">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <div class="badge">
        <img src="public/assets/conference/cvpr-navbar-logo.svg" alt="CVPR">
        Workshop
        <span class="edition">5th Edition</span>
      </div>
      <div class="update-tag">Important Update</div>
      <h1>What is Next in<br>Multimodal Foundation Models?</h1>
      <div class="subtitle">New room &amp; poster session details — see you in Denver!</div>
    </div>
  </div>

  <!-- UPDATES -->
  <div class="updates">
    <div class="upd-item">
      <div class="upd-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      </div>
      <div>
        <div class="upd-label">Date</div>
        <div class="upd-value">June 3, 2026 <span class="sub">Afternoon</span></div>
      </div>
    </div>

    <div class="upd-item accent">
      <div class="upd-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      </div>
      <div>
        <div class="upd-label">New Workshop Room</div>
        <div class="upd-value">Four Seasons 4</div>
      </div>
    </div>

    <div class="upd-item">
      <div class="upd-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
      </div>
      <div>
        <div class="upd-label">Poster Session</div>
        <div class="upd-value">Boards 308–324 <span class="sub">14:00 – 16:30</span></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="footer-logo">MMFM<span>5th Workshop · CVPR 2026</span></div>
    <div class="footer-url">mmfm-workshop.github.io</div>
  </div>

</div>

</body>
</html>
